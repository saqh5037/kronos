# Kronos — Nginx reverse proxy + TLS
# Path: /etc/nginx/sites-available/kronos.conf
# Enable: sudo ln -s /etc/nginx/sites-available/kronos.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name kronos-fit.com www.kronos-fit.com;

    # Let's Encrypt challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex → www (Kronos canonical en www, opcional)
# Si preferís apex como canonical, invertir esta lógica.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kronos-fit.com;

    ssl_certificate /etc/letsencrypt/live/kronos-fit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kronos-fit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.kronos-fit.com$request_uri;
}

# www.kronos-fit.com → Next.js en :3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kronos-fit.com;

    ssl_certificate /etc/letsencrypt/live/kronos-fit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kronos-fit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Body size para uploads (foto pizarra OCR)
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health endpoint sin caché
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Static assets de Next.js — cache largo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
