<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registra tu progreso físico — Kronos Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --k-lima: #C8FF2D;
      --k-dark: #08080A;
      --k-surface: #0F0F11;
      --k-surface-elevated: #141416;
      --k-border: rgba(255,255,255,0.08);
      --k-text: #F5F5F5;
      --k-text-secondary: #A3A3A3;
      --k-glass: rgba(15,15,17,0.92);
      --k-glass-border: rgba(200,255,45,0.12);
      --font-display: 'IBM Plex Mono', monospace;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--k-dark);
      color: var(--k-text);
      font-family: var(--font-body);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .guide-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      background: linear-gradient(to bottom, rgba(8,8,10,0.95) 0%, rgba(8,8,10,0.6) 60%, transparent 100%);
      pointer-events: none;
    }
    .guide-header > * { pointer-events: auto; }

    .guide-logo {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--k-lima);
      letter-spacing: 0.08em;
    }

    .guide-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 500;
      color: var(--k-text-secondary);
      position: absolute;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--k-surface-elevated);
      border: 1px solid var(--k-border);
      color: var(--k-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .icon-btn:hover, .icon-btn:focus-visible {
      border-color: var(--k-lima);
      color: var(--k-lima);
      outline: none;
      box-shadow: 0 0 0 2px rgba(200,255,45,0.15);
    }
    .icon-btn.active {
      border-color: var(--k-lima);
      color: var(--k-lima);
    }
    .icon-btn svg { width: 16px; height: 16px; }

    .speed-btn {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      width: 40px;
      letter-spacing: 0.02em;
    }

    .stage {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 56px 0 140px;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 16px;
      gap: 16px;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .zoom-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      max-height: 52vh;
      aspect-ratio: 390 / 844;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--k-border);
      background: var(--k-surface);
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .zoom-container:active, .zoom-container.dragging {
      cursor: grabbing;
    }
    .zoom-wrapper {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
    }
    .zoom-wrapper.smooth {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 16px;
    }

    .hotspot {
      position: absolute;
      border: 2px solid var(--k-lima);
      border-radius: 10px;
      box-shadow: 0 0 0 4px rgba(200,255,45,0.12), 0 0 32px rgba(200,255,45,0.15);
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .hotspot.pulsing::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      border: 2px solid var(--k-lima);
      animation: hotspotPulse 2s ease-out infinite;
    }
    @keyframes hotspotPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .slide.active .hotspot {
      opacity: 1;
      transform: scale(1);
    }

    .step-badge {
      position: absolute;
      top: 12px; left: 12px;
      padding: 6px 12px;
      background: var(--k-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--k-glass-border);
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--k-lima);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.1s;
      pointer-events: none;
    }
    .slide.active .step-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-panel {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px;
      background: var(--k-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--k-glass-border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .caption-text-wrap {
      position: relative;
      font-size: 14px;
      line-height: 1.6;
      min-height: 1.6em;
    }
    .caption-base {
      color: var(--k-text-secondary);
    }
    .caption-highlight {
      position: absolute;
      top: 0; left: 0;
      color: var(--k-lima);
      overflow: hidden;
      white-space: nowrap;
      width: 0%;
      transition: width 0.15s linear;
      text-shadow: 0 0 12px rgba(200,255,45,0.25);
    }

    .minimap {
      position: fixed;
      right: 16px;
      top: 50%; transform: translateY(-50%);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 150;
      background: var(--k-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--k-glass-border);
      border-radius: 14px;
      padding: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .minimap::-webkit-scrollbar { width: 4px; }
    .minimap::-webkit-scrollbar-thumb { background: var(--k-border); border-radius: 2px; }
    .minimap-thumb {
      width: 44px; height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s ease;
      position: relative;
      background: var(--k-surface);
    }
    .minimap-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .minimap-thumb:hover, .minimap-thumb:focus-visible {
      opacity: 0.85;
      border-color: var(--k-border);
      outline: none;
    }
    .minimap-thumb.active {
      opacity: 1;
      border-color: var(--k-lima);
      box-shadow: 0 0 12px rgba(200,255,45,0.2);
    }
    .minimap-thumb .mm-num {
      position: absolute;
      bottom: 2px; left: 2px;
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      color: var(--k-lima);
      background: rgba(8,8,10,0.8);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .dots-bar {
      position: fixed;
      bottom: 52px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 150;
      padding: 6px 12px;
      background: var(--k-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--k-glass-border);
      border-radius: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--k-border);
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 0;
    }
    .dot.active {
      background: var(--k-lima);
      box-shadow: 0 0 8px rgba(200,255,45,0.4);
      transform: scale(1.2);
    }
    .dot:focus-visible {
      outline: 2px solid var(--k-lima);
      outline-offset: 2px;
    }

    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--k-surface-elevated);
      border: 1px solid var(--k-border);
      color: var(--k-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 150;
    }
    .nav-btn:hover, .nav-btn:focus-visible {
      background: var(--k-surface);
      border-color: var(--k-lima);
      color: var(--k-lima);
      outline: none;
      box-shadow: 0 0 0 3px rgba(200,255,45,0.12);
    }
    .nav-btn.prev { left: 14px; }
    .nav-btn.next { right: 14px; }
    .nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: var(--k-border);
      color: var(--k-text-secondary);
    }
    .nav-btn svg { width: 18px; height: 18px; }

    .progress-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--k-surface-elevated);
      z-index: 200;
    }
    .progress-fill {
      height: 100%;
      background: var(--k-lima);
      box-shadow: 0 0 10px rgba(200,255,45,0.35);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-text {
      position: fixed;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--k-text-secondary);
      letter-spacing: 0.05em;
      z-index: 150;
      pointer-events: none;
    }

    .zoom-hint {
      position: absolute;
      bottom: 8px; right: 8px;
      padding: 4px 8px;
      background: rgba(8,8,10,0.7);
      border-radius: 6px;
      font-size: 10px;
      color: var(--k-text-secondary);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      font-family: var(--font-display);
    }
    .zoom-container:hover .zoom-hint,
    .zoom-container:active .zoom-hint {
      opacity: 1;
    }

    @media (min-width: 1024px) {
      .stage { padding: 56px 80px 100px; }
      .zoom-container { max-width: 360px; max-height: 58vh; }
      .minimap { display: flex; }
      .dots-bar { display: none; }
      .nav-btn.prev { left: 24px; }
      .nav-btn.next { right: 80px; }
      .caption-panel { max-width: 480px; }
    }

    @media (min-width: 1280px) {
      .zoom-container { max-width: 400px; }
      .nav-btn.prev { left: 32px; }
      .nav-btn.next { right: 100px; }
    }

    @media (max-width: 380px) {
      .zoom-container { border-radius: 12px; max-height: 48vh; }
      .slide-img { border-radius: 12px; }
      .caption-panel { padding: 12px 14px; border-radius: 12px; }
      .caption-text-wrap { font-size: 13px; }
      .guide-title { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide, .zoom-wrapper.smooth, .hotspot, .step-badge,
      .minimap-thumb, .dot, .nav-btn, .progress-fill, .caption-highlight {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="guide-header">
    <div class="guide-logo">KRONOS</div>
    <div class="guide-title">Registra tu progreso físico</div>
    <div class="audio-controls">
      <button class="icon-btn" id="playBtn" onclick="togglePlay()" aria-label="Reproducir" title="Reproducir / Pausar">
        <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="icon-btn speed-btn" id="speedBtn" onclick="cycleSpeed()" title="Velocidad" aria-label="Cambiar velocidad">1x</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="minimap" id="minimap" role="tablist" aria-label="Navegación de pasos"></div>

  <div class="dots-bar" id="dotsBar" role="tablist" aria-label="Navegación de pasos"></div>

  <button class="nav-btn prev" id="prevBtn" onclick="goPrev()" aria-label="Paso anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="nav-btn next" id="nextBtn" onclick="goNext()" aria-label="Paso siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>
  <div class="progress-text" id="progressText">1 / 5</div>

  <script>
    window.steps = [{"id":"salud-overview","order":1,"title":"Tu Cuerpo en el Tiempo","description":"Salud reúne tu peso, IMC y tendencia en un solo lugar, separado del entrenamiento.","narration":"Bienvenido a Salud. Aquí registras tu peso, tu composición corporal y tus metas. Todo separado del entrenamiento, en su propia pantalla.","url":"/atleta/salud","action":"screenshot","duration":10.4,"scrollY":0,"screenshot":"01-salud.png"},{"id":"today","order":2,"title":"Tu Cuerpo Hoy","description":"Tu peso más reciente, el cambio vs la medición anterior, y tu IMC calculado con tu altura.","narration":"Tu peso más reciente, con el cambio respecto a la última medición. Lima si bajaste, gris si subiste. Y tu IMC se calcula solo a partir de tu altura.","url":"/atleta/salud","action":"screenshot","duration":10.4,"scrollY":100,"screenshot":"02-cuerpo-hoy.png"},{"id":"trend","order":3,"title":"Peso 90 Días","description":"Gráfico de tu peso en los últimos 90 días. La tendencia salta a la vista sin Excel ni apps externas.","narration":"El gráfico muestra tu peso en los últimos noventa días. La tendencia salta a la vista. Nada de Excel, nada de apps externas. Tu progreso real, en tu app del box.","url":"/atleta/salud","action":"screenshot","duration":12.5,"scrollY":350,"screenshot":"03-tendencia.png"},{"id":"goal","order":4,"title":"Crea una Meta","description":"Define un objetivo de composición corporal. Kronos compara cada medición nueva con tu meta.","narration":"Toca crear meta de composición para definir un objetivo concreto. Kronos compara cada medición nueva con tu objetivo y te dice qué tan cerca estás.","url":"/atleta/salud","action":"screenshot","duration":10.4,"scrollY":550,"screenshot":"04-meta.png"},{"id":"register","order":5,"title":"Registra una Medición","description":"El botón superior te permite agregar peso, body fat, masa muscular u otros valores cuando quieras.","narration":"El botón superior te permite agregar una medición nueva cuando quieras: peso, body fat, masa muscular. Lo que tu coach te pida, lo guardas aquí.","url":"/atleta/salud","action":"screenshot","duration":10.4,"scrollY":0,"screenshot":"05-registrar.png"}];

    const steps = window.steps;
    let current = 0;
    let isPlaying = false;
    let playbackRate = 1;
    let isManualOverride = false;
    let audio = null;
    let audioError = false;

    const timeRanges = steps.map((step, i) => {
      const start = steps.slice(0, i).reduce((sum, st) => sum + (st.duration || 5), 0);
      return { index: i, start, end: start + (step.duration || 5), ...step };
    });
    const totalDuration = timeRanges[timeRanges.length - 1].end;

    const stage = document.getElementById('stage');
    const minimap = document.getElementById('minimap');
    const dotsBar = document.getElementById('dotsBar');

    steps.forEach((step, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (i === 0 ? ' active' : '');
      slide.dataset.step = String(i);
      slide.innerHTML = `
        <div class="zoom-container" id="zc-${i}">
          <div class="zoom-wrapper" id="zw-${i}">
            <img class="slide-img" src="./screenshots/${step.screenshot}" alt="${step.title}" loading="${i === 0 ? 'eager' : 'lazy'}">
            ${step.hotspot ? `<div class="hotspot pulsing" style="left:${step.hotspot.x}%;top:${step.hotspot.y}%;width:${step.hotspot.width}%;height:${step.hotspot.height}%;"></div>` : '<div class="hotspot" style="display:none;"></div>'}
          </div>
          <div class="zoom-hint">Pinch o scroll para zoom · doble tap para reset</div>
        </div>
        <div class="step-badge">Paso ${i + 1} de ${steps.length}</div>
        <div class="caption-panel" aria-live="polite" aria-atomic="true">
          <div class="caption-text-wrap" id="cap-${i}">
            <span class="caption-base">${step.narration}</span>
            <span class="caption-highlight" id="hl-${i}">${step.narration}</span>
          </div>
        </div>
      `;
      stage.appendChild(slide);

      const thumb = document.createElement('button');
      thumb.className = 'minimap-thumb' + (i === 0 ? ' active' : '');
      thumb.dataset.index = String(i);
      thumb.setAttribute('role', 'tab');
      thumb.setAttribute('aria-label', `Paso ${i + 1}: ${step.title}`);
      thumb.innerHTML = `<img src="./screenshots/${step.screenshot}" alt="" loading="lazy"><span class="mm-num">${i + 1}</span>`;
      thumb.onclick = () => { goTo(i); };
      minimap.appendChild(thumb);

      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.dataset.index = String(i);
      dot.setAttribute('role', 'tab');
      dot.setAttribute('aria-label', `Paso ${i + 1}: ${step.title}`);
      dot.onclick = () => { goTo(i); };
      dotsBar.appendChild(dot);
    });

    function initAudio() {
      if (audio) return;
      audio = new Audio('./voiceover.mp3');
      audio.preload = 'auto';
      audio.playbackRate = playbackRate;
      audio.addEventListener('timeupdate', onAudioTimeUpdate);
      audio.addEventListener('ended', () => {
        isPlaying = false;
        isManualOverride = false;
        updatePlayBtn();
      });
      audio.addEventListener('error', () => {
        audioError = true;
        console.warn('Audio no disponible');
      });
    }

    function onAudioTimeUpdate() {
      if (!audio || isManualOverride) return;
      const t = audio.currentTime;
      const range = timeRanges.find(r => t >= r.start && t < r.end);
      if (range && range.index !== current) {
        showSlide(range.index, false);
      }
      updateCaptionProgress(t);
    }

    function updateCaptionProgress(time) {
      const range = timeRanges[current];
      if (!range) return;
      const progress = Math.min(1, Math.max(0, (time - range.start) / (range.end - range.start)));
      const hl = document.getElementById('hl-' + current);
      if (hl) hl.style.width = (progress * 100) + '%';
    }

    function togglePlay() {
      initAudio();
      if (!audio) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        if (audioError) {
          isPlaying = true;
          isManualOverride = false;
          autoAdvanceWithoutAudio();
        } else {
          const range = timeRanges[current];
          if (range && audio.currentTime < range.start - 0.1) {
            audio.currentTime = range.start;
          }
          audio.play().catch(() => {
            audioError = true;
            isPlaying = true;
            autoAdvanceWithoutAudio();
          });
          isPlaying = true;
          isManualOverride = false;
        }
      }
      updatePlayBtn();
    }

    let autoAdvanceTimer = null;
    function autoAdvanceWithoutAudio() {
      clearTimeout(autoAdvanceTimer);
      if (!isPlaying) return;
      const range = timeRanges[current];
      if (!range) return;
      const remaining = (range.end - range.start) / playbackRate;
      autoAdvanceTimer = setTimeout(() => {
        if (!isPlaying) return;
        if (current < steps.length - 1) {
          showSlide(current + 1, false);
          autoAdvanceWithoutAudio();
        } else {
          isPlaying = false;
          updatePlayBtn();
        }
      }, remaining * 1000);
    }

    function cycleSpeed() {
      const speeds = [1, 1.5, 2];
      const idx = speeds.indexOf(playbackRate);
      playbackRate = speeds[(idx + 1) % speeds.length];
      if (audio) audio.playbackRate = playbackRate;
      document.getElementById('speedBtn').textContent = playbackRate + 'x';
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      btn.classList.toggle('active', isPlaying);
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      btn.setAttribute('aria-label', isPlaying ? 'Pausar' : 'Reproducir');
      btn.setAttribute('title', isPlaying ? 'Pausar' : 'Reproducir');
    }

    var zoomStates = steps.map(() => ({
      scale: 1, tx: 0, ty: 0,
      dragging: false, pinch: false,
      startDist: 0, startScale: 1,
      startX: 0, startY: 0
    }));

    function getZoomContainer(index) {
      return document.getElementById('zc-' + index);
    }
    function getZoomWrapper(index) {
      return document.getElementById('zw-' + index);
    }

    function updateZoomTransform(index) {
      const zs = zoomStates[index];
      const wrapper = getZoomWrapper(index);
      if (!wrapper) return;
      wrapper.style.transform = `translate3d(${zs.tx}px, ${zs.ty}px, 0) scale(${zs.scale})`;
    }

    function resetZoom(index) {
      const zs = zoomStates[index];
      zs.scale = 1; zs.tx = 0; zs.ty = 0; zs.dragging = false; zs.pinch = false;
      const wrapper = getZoomWrapper(index);
      if (wrapper) {
        wrapper.classList.add('smooth');
        updateZoomTransform(index);
        setTimeout(() => wrapper.classList.remove('smooth'), 250);
      }
    }

    function clampPan(index, containerW, containerH) {
      const zs = zoomStates[index];
      if (zs.scale <= 1) { zs.tx = 0; zs.ty = 0; return; }
      const maxX = containerW * (zs.scale - 1) * 0.5;
      const maxY = containerH * (zs.scale - 1) * 0.5;
      zs.tx = Math.max(-maxX, Math.min(maxX, zs.tx));
      zs.ty = Math.max(-maxY, Math.min(maxY, zs.ty));
    }

    function showSlide(index, stopAudio = true) {
      if (index < 0 || index >= steps.length) return;
      resetZoom(current);
      document.querySelectorAll('.slide').forEach((s, i) => {
        s.classList.toggle('active', i === index);
      });
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === steps.length - 1;
      document.getElementById('progressFill').style.width = ((index + 1) / steps.length * 100) + '%';
      document.getElementById('progressText').textContent = (index + 1) + ' / ' + steps.length;
      document.querySelectorAll('.minimap-thumb').forEach((t, i) => {
        t.classList.toggle('active', i === index);
        t.setAttribute('aria-selected', String(i === index));
      });
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === index);
        d.setAttribute('aria-selected', String(i === index));
      });
      document.querySelectorAll('.caption-highlight').forEach(hl => hl.style.width = '0%');
      current = index;
      if (stopAudio && audio) {
        audio.pause();
        isPlaying = false;
        isManualOverride = true;
        updatePlayBtn();
      }
    }

    function goNext() {
      if (current < steps.length - 1) goTo(current + 1);
    }
    function goPrev() {
      if (current > 0) goTo(current - 1);
    }
    function goTo(index) {
      if (index === current) return;
      showSlide(index, true);
    }

    steps.forEach((_, i) => {
      const container = getZoomContainer(i);
      if (!container) return;

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zs = zoomStates[i];
        const delta = e.deltaY > 0 ? -0.12 : 0.12;
        const newScale = Math.min(4, Math.max(1, zs.scale + delta));
        if (newScale !== zs.scale) {
          zs.scale = newScale;
          if (zs.scale <= 1) { zs.tx = 0; zs.ty = 0; }
          const rect = container.getBoundingClientRect();
          clampPan(i, rect.width, rect.height);
          updateZoomTransform(i);
        }
      }, { passive: false });

      container.addEventListener('touchstart', (e) => {
        const zs = zoomStates[i];
        if (e.touches.length === 2) {
          e.preventDefault();
          zs.pinch = true;
          zs.dragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          zs.startDist = Math.sqrt(dx * dx + dy * dy);
          zs.startScale = zs.scale;
          container.classList.add('dragging');
        } else if (e.touches.length === 1 && zs.scale > 1) {
          zs.dragging = true;
          zs.pinch = false;
          zs.startX = e.touches[0].clientX - zs.tx;
          zs.startY = e.touches[0].clientY - zs.ty;
          container.classList.add('dragging');
        }
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        const zs = zoomStates[i];
        if (e.touches.length === 2 && zs.pinch) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const ratio = dist / (zs.startDist || 1);
          zs.scale = Math.min(4, Math.max(1, zs.startScale * ratio));
          const rect = container.getBoundingClientRect();
          clampPan(i, rect.width, rect.height);
          updateZoomTransform(i);
        } else if (e.touches.length === 1 && zs.dragging && zs.scale > 1) {
          e.preventDefault();
          zs.tx = e.touches[0].clientX - zs.startX;
          zs.ty = e.touches[0].clientY - zs.startY;
          const rect = container.getBoundingClientRect();
          clampPan(i, rect.width, rect.height);
          updateZoomTransform(i);
        }
      }, { passive: false });

      container.addEventListener('touchend', () => {
        zoomStates[i].pinch = false;
        zoomStates[i].dragging = false;
        container.classList.remove('dragging');
      });

      let lastTap = 0;
      container.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
          e.preventDefault();
          resetZoom(i);
        }
        lastTap = now;
      });

      let activePointer = null;
      container.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        if (zoomStates[i].scale <= 1) return;
        activePointer = e.pointerId;
        const zs = zoomStates[i];
        zs.dragging = true;
        zs.startX = e.clientX - zs.tx;
        zs.startY = e.clientY - zs.ty;
        container.setPointerCapture(e.pointerId);
        container.classList.add('dragging');
      });
      container.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointer) return;
        const zs = zoomStates[i];
        if (!zs.dragging || zs.scale <= 1) return;
        zs.tx = e.clientX - zs.startX;
        zs.ty = e.clientY - zs.startY;
        const rect = container.getBoundingClientRect();
        clampPan(i, rect.width, rect.height);
        updateZoomTransform(i);
      });
      container.addEventListener('pointerup', (e) => {
        if (e.pointerId !== activePointer) return;
        zoomStates[i].dragging = false;
        activePointer = null;
        container.classList.remove('dragging');
      });
      container.addEventListener('pointercancel', (e) => {
        if (e.pointerId !== activePointer) return;
        zoomStates[i].dragging = false;
        activePointer = null;
        container.classList.remove('dragging');
      });

      container.addEventListener('dblclick', (e) => {
        e.preventDefault();
        resetZoom(i);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        goNext();
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goPrev();
      }
      if (e.key === 'Escape') {
        resetZoom(current);
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = touchStartX - e.changedTouches[0].screenX;
      const dy = touchStartY - e.changedTouches[0].screenY;
      const dt = Date.now() - touchStartTime;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60 && dt < 400) {
        const zs = zoomStates[current];
        if (zs && zs.scale <= 1.05) {
          dx > 0 ? goNext() : goPrev();
        }
      }
    }, { passive: true });

    showSlide(0, false);
    updatePlayBtn();
  </script>
</body>
</html>
