<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kronos Folleto — Neón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: 5.75in 8.75in; margin: 0; }
body {
  width: 5.75in; height: 8.75in;
  font-family: 'Inter', sans-serif;
  overflow: hidden; position: relative;
  background: #0a0a0f;
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(200,255,45,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,255,45,0.03) 1px, transparent 1px);
  background-size: 0.25in 0.25in;
}
.glow {
  position: absolute; top: -1in; right: -1in;
  width: 5in; height: 5in;
  background: radial-gradient(circle, rgba(200,255,45,0.15) 0%, transparent 60%);
  pointer-events: none;
}
.glow2 {
  position: absolute; bottom: -1.5in; left: -1in;
  width: 5in; height: 5in;
  background: radial-gradient(circle, rgba(0,68,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.safe {
  position: absolute;
  top: 0.375in; left: 0.375in; right: 0.375in; bottom: 0.375in;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center;
}
.logo-wrap {
  width: 0.9in; height: 0.9in;
  background: #C8FF2D; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0.3in;
  box-shadow: 0 0 40px rgba(200,255,45,0.4);
}
.logo-wrap span {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 0.55in;
  color: #08080A; line-height: 1;
}
.badge {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 500; font-size: 9pt;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: #C8FF2D; margin-bottom: 0.25in;
}
h1 {
  font-weight: 900; font-size: 30pt;
  line-height: 1.08; letter-spacing: -0.02em;
  margin-bottom: 0.12in;
}
h1 span { color: #C8FF2D; }
.sub {
  font-weight: 400; font-size: 12.5pt;
  line-height: 1.55; opacity: 0.75;
  max-width: 4.3in; margin-bottom: 0.3in;
}
.stats {
  display: flex; gap: 0.2in; margin-bottom: 0.3in;
}
.stat {
  border: 1px solid rgba(200,255,45,0.25);
  border-radius: 12px; padding: 0.15in 0.2in;
  min-width: 1.2in;
}
.stat-num {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 20pt;
  color: #C8FF2D; display: block;
}
.stat-label {
  font-size: 7.5pt; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  opacity: 0.7;
}
.qr-wrap {
  background: white; border-radius: 18px;
  padding: 0.15in; margin-bottom: 0.15in;
  box-shadow: 0 0 30px rgba(200,255,45,0.25);
}
.qr-wrap img { width: 1.5in; height: 1.5in; display: block; }
.cta {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 11pt;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: #C8FF2D; margin-bottom: 6px;
}
.url {
  font-size: 9pt; opacity: 0.55;
  font-family: 'IBM Plex Mono', monospace;
}
.bar {
  width: 0.8in; height: 3px;
  background: #C8FF2D; border-radius: 2px;
  margin: 0.25in 0 0.15in;
  box-shadow: 0 0 10px rgba(200,255,45,0.5);
}
.footer {
  position: absolute; bottom: 0.4in; left: 0; right: 0;
  text-align: center;
}
.footer p {
  font-size: 7.5pt; opacity: 0.4;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.06em;
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div><div class="glow2"></div>
<div class="safe">
  <div class="logo-wrap"><span>K</span></div>
  <div class="badge">El Sistema Operativo de tu Box</div>
  <h1>TU ENTRENAMIENTO.<br><span>TU HISTORIA.</span></h1>
  <p class="sub">Lleva tu progreso en el bolsillo. Reserva clases, registra tus PRs y construye tu racha con la app que tu box ya usa.</p>
  <div class="stats">
    <div class="stat"><span class="stat-num">∞</span><span class="stat-label">PRs</span></div>
    <div class="stat"><span class="stat-num">365</span><span class="stat-label">Días</span></div>
    <div class="stat"><span class="stat-num">1</span><span class="stat-label">App</span></div>
  </div>
  <div class="qr-wrap">
    <img src="qr-code.svg" alt="QR">
  </div>
  <div class="cta">Escanea y únete</div>
  <div class="url">kronos-fit.com/atleta-signup</div>
  <div class="bar"></div>
  <div class="footer">
    <p>Evento Especial · Sábado · Registro 100% Gratuito</p>
  </div>
</div>
</body>
</html>
