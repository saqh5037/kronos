<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kronos Folleto — Box Owners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: 5.75in 8.75in; margin: 0; }
body {
  width: 5.75in; height: 8.75in;
  font-family: 'Inter', sans-serif;
  overflow: hidden; position: relative;
  background: #0a0a0f;
}
.photo-bg {
  position: absolute; inset: 0;
  background: url('/Users/samuelquiroz/Documents/proyectos/kronos/public/images/landing/box-hero-coach-tablet.webp') center/cover no-repeat;
}
.photo-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,15,0.35) 0%, rgba(10,10,15,0.82) 40%, rgba(0,26,153,0.92) 100%);
}
.safe {
  position: absolute;
  top: 0.375in; left: 0.375in; right: 0.375in; bottom: 0.375in;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: white; text-align: center;
  z-index: 2;
}
.logo-wrap {
  width: 0.85in; height: 0.85in;
  background: #C8FF2D; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0.25in;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.logo-wrap span {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 0.52in;
  color: #08080A; line-height: 1;
}
.badge {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 500; font-size: 8.5pt;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: #00bfff; margin-bottom: 0.2in;
  background: rgba(0,0,0,0.35);
  padding: 4px 14px; border-radius: 20px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(0,191,255,0.25);
}
h1 {
  font-weight: 900; font-size: 30pt;
  line-height: 1.08; letter-spacing: -0.02em;
  margin-bottom: 0.12in;
  text-shadow: 0 3px 16px rgba(0,0,0,0.5);
}
h1 span { color: #00bfff; }
.sub {
  font-weight: 400; font-size: 12pt;
  line-height: 1.55; opacity: 0.9;
  max-width: 4.3in; margin-bottom: 0.25in;
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}
.features {
  display: flex; gap: 0.15in; margin-bottom: 0.25in;
  flex-wrap: wrap; justify-content: center;
}
.feature {
  background: rgba(0,68,255,0.15);
  border: 1px solid rgba(0,191,255,0.25);
  border-radius: 10px;
  padding: 0.14in 0.18in;
  text-align: center; min-width: 0.95in;
}
.feature-label {
  font-size: 8pt; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: #00bfff;
  font-family: 'IBM Plex Mono', monospace;
}
.qr-wrap {
  background: white; border-radius: 18px;
  padding: 0.15in; margin-bottom: 0.1in;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.qr-wrap img { width: 1.5in; height: 1.5in; display: block; }
.cta {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700; font-size: 11pt;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: #00bfff; margin-bottom: 6px;
}
.url {
  font-size: 9pt; opacity: 0.6;
  font-family: 'IBM Plex Mono', monospace;
}
.footer {
  margin-top: 0.15in;
  text-align: center;
}
.footer p {
  font-size: 7.5pt; opacity: 0.5;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.06em;
}
</style>
</head>
<body>
<div class="photo-bg"></div>
<div class="safe">
  <div class="logo-wrap"><span>K</span></div>
  <div class="badge">Para Dueños de Box</div>
  <h1>TU BOX.<br><span>SIN CAOS.</span></h1>
  <p class="sub">Reservas, pagos, WODs, asistencia y reportes. Todo en una app, en español, con <strong>tu logo y tu color</strong>.</p>
  <div class="features">
    <div class="feature"><span class="feature-label">Reservas</span></div>
    <div class="feature"><span class="feature-label">Pagos</span></div>
    <div class="feature"><span class="feature-label">WODs</span></div>
    <div class="feature"><span class="feature-label">Reportes</span></div>
  </div>
  <div class="qr-wrap">
    <img src="qr-code-box.svg" alt="QR">
  </div>
  <div class="cta">Prueba 14 días gratis</div>
  <div class="url">kronos-fit.com/signup</div>
  <div class="footer">
    <p>Evento Especial · Sábado · Sin compromiso</p>
  </div>
</div>
</body>
</html>
