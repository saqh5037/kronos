name: CI

on:
  push:
    branches: [main, rebuild/base]
  pull_request:
    branches: [main, rebuild/base]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the hygiene guards (tests/unit/dialect-guard.test.ts and
      # tests/unit/ui-guards.test.ts) — they are ordinary vitest files, so they
      # need no extra step. They ratchet against tests/fixtures/guard-baseline.json:
      # a file's violation count may only go down. See the header of
      # tests/unit/ui-guards.test.ts.
      - name: Unit tests
        run: pnpm test

      # tests/integration/** is excluded from `pnpm test` (needs a real Postgres)
      # and e2e stays out of CI on purpose — 26 Playwright specs, run manually.
      # Perf lives in its own workflow: .github/workflows/lighthouse.yml, which
      # honours a `skip-perf` PR label.
