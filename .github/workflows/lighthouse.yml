name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-perf')"
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build production bundle
        run: pnpm build
        env:
          DATABASE_URL: postgresql://lhci:lhci@localhost:5432/lhci_stub
          DIRECT_DATABASE_URL: postgresql://lhci:lhci@localhost:5432/lhci_stub
          NEXTAUTH_SECRET: ci-stub-secret-not-used
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Lighthouse CI
        run: pnpm add -D -w @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=lighthouserc.json
        env:
          DATABASE_URL: postgresql://lhci:lhci@localhost:5432/lhci_stub
          DIRECT_DATABASE_URL: postgresql://lhci:lhci@localhost:5432/lhci_stub
          NEXTAUTH_SECRET: ci-stub-secret-not-used
          NEXTAUTH_URL: http://localhost:3000
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
